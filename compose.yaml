services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    container_name: postgres-vector
    environment:
      - 'POSTGRES_DB=hsdb'
      - 'POSTGRES_PASSWORD=12345678'
      - 'POSTGRES_USER=postgres'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - "55460:5432"