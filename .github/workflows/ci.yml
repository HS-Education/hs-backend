name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-postgres:
    name: Backend / Java + PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create disposable test environment
        shell: bash
        run: |
          cat > .env <<EOF
          JWT_SECRET=$(openssl rand -hex 32)
          JWT_EXPIRATION_MINUTES=60
          JWT_REFRESH_EXPIRATION_DAYS=7
          STUDENT_USERNAME=ci_student
          TEACHER_USERNAME=ci_teacher
          COORDINATOR_USERNAME=ci_coordinator
          ADMIN_USERNAME=ci_admin
          COORDINATOR2_USERNAME=ci_coordinator_2
          STUDENT_PASSWORD=$(openssl rand -hex 16)
          TEACHER_PASSWORD=$(openssl rand -hex 16)
          COORDINATOR_PASSWORD=$(openssl rand -hex 16)
          ADMIN_PASSWORD=$(openssl rand -hex 16)
          COORDINATOR2_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=hs_ci
          POSTGRES_DB_URL=jdbc:postgresql://127.0.0.1:5432/hs_ci
          POSTGRES_HOST_PORT=5432
          POSTGRES_USER=ci_user
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          MINIO_BUCKET_NAME=ci-bucket
          MINIO_URL=http://127.0.0.1:9000
          MINIO_API_PORT=9000
          MINIO_CONSOLE_PORT=9001
          MINIO_ROOT_USER=ci_minio
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          RABBITMQ_HOST=127.0.0.1
          RABBITMQ_AMQP_PORT=5672
          RABBITMQ_MGMT_PORT=15672
          RABBITMQ_USER=ci_rabbit
          RABBITMQ_PASSWORD=$(openssl rand -hex 16)
          PYTHON_WORKER_PORT=8000
          PYTHON_WORKER_BASE_URL=http://127.0.0.1:8000
          WORKER_API_KEY=$(openssl rand -hex 16)
          EOF

      - name: Run Java unit and pgvector integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -Plocal-gate verify

  ai-contract:
    name: Backend / AI offline contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run offline AI contract and validation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
