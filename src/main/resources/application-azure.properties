app.storage.provider=azure-blob
app.messaging.provider=service-bus
spring.autoconfigure.exclude=org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
management.health.rabbit.enabled=false
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
# The CD migration runner owns DDL; the application identity only validates and uses the schema.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=${HTTP_MAX_THREADS:40}
server.forward-headers-strategy=framework
server.port=${PORT:8080}
app.frontend.enabled=${FRONTEND_ENABLED:false}
app.auth.cookie-secure=true
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.allowed-origins=${FRONTEND_ORIGIN}
app.auth.origin-check-enabled=true
app.seed-demo-users=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
azure.storage.account-url=${AZURE_STORAGE_ACCOUNT_URL}
azure.storage.documents-container=${AZURE_DOCUMENTS_CONTAINER:documents}
azure.storage.results-container=${AZURE_RESULTS_CONTAINER:processing-results}
azure.servicebus.namespace=${AZURE_SERVICEBUS_NAMESPACE}
azure.servicebus.processing-queue=${AZURE_PROCESSING_QUEUE:document-processing}
azure.servicebus.results-queue=${AZURE_RESULTS_QUEUE:embeddings-ready}
azure.servicebus.failures-queue=${AZURE_FAILURES_QUEUE:document-processing-failed}
azure.servicebus.notifications-topic=${AZURE_NOTIFICATIONS_TOPIC:notifications}
azure.servicebus.notifications-subscription=${AZURE_NOTIFICATIONS_SUBSCRIPTION:backend-single-instance}
azure.servicebus.max-concurrent-calls=1
azure.servicebus.max-lock-renewal-minutes=30
