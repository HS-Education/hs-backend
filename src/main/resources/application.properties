spring.application.name=hs-tesis
spring.profiles.default=local
app.storage.provider=minio
app.messaging.provider=rabbitmq
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=${APP_RABBIT_HEALTH_ENABLED:true}
app.auth.cookie-secure=false
app.auth.cookie-same-site=Strict
app.auth.allowed-origins=http://localhost:8080,http://localhost:4200
app.auth.origin-check-enabled=false
app.seed-demo-users=true
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
jwt.secret=${JWT_SECRET}

spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.connection-timeout=5000
server.tomcat.threads.max=${HTTP_MAX_THREADS:120}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}

spring.jpa.hibernate.ddl-auto=update

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.swagger-ui.tagsSorter=alpha

spring.docker.compose.enabled=false
spring.jpa.open-in-view=false

spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}

minio.url=${MINIO_URL:}
minio.access-key=${MINIO_ROOT_USER:}
minio.secret-key=${MINIO_ROOT_PASSWORD:}
minio.bucket=${MINIO_BUCKET_NAME:}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=4

spring.jpa.hibernate.naming.physical-strategy=com.hs.hstesis.shared.infrastructure.persistance.jpa.strategy.SnakeCasePhysicalNamingStrategy

ai.service.url=${PYTHON_WORKER_BASE_URL}
ai.service.api-key=${WORKER_API_KEY}

# Increase upload limits for large PDFs
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
